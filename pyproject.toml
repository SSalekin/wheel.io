[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheelio"
version = "0.1.0"
description = "Chat-driven random-name wheel"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "pytesseract",
    "opencv-python",
    "numpy",
    "pillow",
    "httpx",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "respx"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
