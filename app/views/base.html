<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wheelio</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/wheel.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Wheelio</h1>
    </header>

    <main class="panes">
      <section class="pane pane-chat">
        <h2 class="pane-title">Chat</h2>
        <div id="chat-log" class="chat-log"></div>
      </section>

      <section class="pane pane-wheel">
        <div id="banner" class="banner"></div>
        {% set wheel_data = [] %}
        {% include "partials/wheel_pane.html" %}
        {% set entries = session.entries %}
        {% set remove_picked = session.remove_picked %}
        {% include "partials/go_form.html" %}
      </section>

      <section class="pane pane-picked">
        <h2 class="pane-title">Picked</h2>
        {% set picked = [] %}
        {% include "partials/picked_list.html" %}
      </section>
    </main>

    <footer class="chat-bar">
      <div id="file-preview" class="file-preview"></div>
      <form id="chat-form" class="chat-form"
            hx-post="/chat"
            hx-target="#chat-log"
            hx-swap="beforeend"
            hx-encoding="multipart/form-data"
            enctype="multipart/form-data">
        <input type="hidden" name="token" value="{{ session.token }}">
        <label class="attach-button" title="Attach images">
          <span aria-hidden="true">&#128206;</span>
          <input type="file" name="files" id="file-input" multiple accept="image/png,image/jpeg,image/webp">
        </label>
        <input type="text" name="message" class="chat-input"
               placeholder="type a message…" autocomplete="off">
        <button type="submit" class="send-button" title="Send">&#10148;</button>
      </form>
    </footer>
  </div>
</body>
</html>
