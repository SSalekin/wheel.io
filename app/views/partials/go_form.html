<form id="go-form" class="go-form" hx-swap-oob="true">
  <button type="submit" class="go-button"{% if not entries %} disabled{% endif %}>Go</button>
  <label class="remove-picked-label">
    <input type="checkbox" id="remove-picked" name="remove_picked" value="true"{% if remove_picked %} checked{% endif %}>
    Remove picked from wheel
  </label>
</form>
