<div id="wheel-pane" hx-swap-oob="true">
  <div class="wheel-ring">
    <canvas id="wheel" width="480" height="480" role="img" aria-label="Prize wheel"></canvas>
  </div>
  {%- if wheel_data %}
  <ul class="visually-hidden">
    {%- for entry in wheel_data %}
    <li>{{ entry.label }}</li>
    {%- endfor %}
  </ul>
  {%- endif %}
  <div id="wheel-data" {% if wheel_data %}data-entries='{{ wheel_data | tojson }}'{% else %}data-entries="[]"{% endif %}{% if spin_data %} data-spin-entries='{{ spin_data | tojson }}'{% endif %}{% if glow_index is not none %} data-glow-index="{{ glow_index }}"{% endif %}{% if animate %} data-animate="1" data-pre-index="{{ pre_index }}"{% endif %}></div>
  {%- if not wheel_data %}
  <p class="empty-hint">type a list or upload an image</p>
  {%- endif %}
</div>
